version: '3.8'

services:
  # MySQL 8.0 Database
  mysql-db:
    image: mysql:8.0
    container_name: cpa-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: campus_placement_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: cpa_user
      MYSQL_PASSWORD: cpa_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Java Spring Boot REST API
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpa-backend-api
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: campus_placement_db
      DB_USERNAME: cpa_user
      DB_PASSWORD: cpa_password
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

volumes:
  db_data:
